<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel font editor</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1a1a1a; --muted: #777; --line: #d8d8d4;
    --grid: #e3e3df; --cell-off: #fbfbfa; --cell-on: #1a1a1a; --overhang: #f0ece2;
    --baseline: #d33; --cap: #2a7fd4; --xh: #3aa655; --advance: #e08a1e; --sel: #ffe9a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg);
         display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #f0f0ee; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; }
  #status { color: var(--muted); min-width: 160px; }
  #status.dirty { color: #b35c00; }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
  aside .search { position: sticky; top: 0; background: var(--panel); padding: 8px; border-bottom: 1px solid var(--line); }
  aside .search input { width: 100%; }
  .group { padding: 6px 8px 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; padding: 0 8px 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 0; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: #f2f2f0; }
  .item.sel { background: var(--sel); border-color: #e6c766; }
  .item canvas { image-rendering: pixelated; }
  .item .ch { font-size: 12px; }
  .item.empty .ch { color: #c33; }
  main { display: grid; grid-template-rows: auto 1fr; overflow: auto; padding: 14px; gap: 10px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .title { font-size: 18px; margin-right: 8px; }
  .toolbar .name { color: var(--muted); }
  .toolbar .adv { display: inline-flex; align-items: center; gap: 4px; }
  .toolbar .adv b { min-width: 2ch; text-align: center; }
  .editor { display: flex; gap: 20px; align-items: flex-start; }
  #grid { background: var(--panel); border: 1px solid var(--line); cursor: crosshair; touch-action: none; }
  .legend { color: var(--muted); font-size: 12px; line-height: 1.8; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .legend kbd { font: 11px/1 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; background: #fff; }
  footer { grid-column: 1 / -1; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 14px; display: grid; gap: 6px; }
  footer input { width: 100%; }
  #sample { image-rendering: pixelated; background: #fff; border: 1px solid var(--line); max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Pixel font editor</h1>
  <span id="status">loading…</span>
  <span class="spacer"></span>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="save" class="primary" title="Ctrl+S">Save</button>
</header>

<aside>
  <div class="search"><input id="search" type="text" placeholder="Type a character to jump to it"></div>
  <div id="list"></div>
</aside>

<main>
  <div class="toolbar">
    <span class="title" id="title"></span>
    <span class="name" id="name"></span>
    <span class="adv">advance <button id="advMinus" title="[">−</button><b id="advance"></b><button id="advPlus" title="]">+</button></span>
    <button id="prev" title="PageUp">◀ prev</button>
    <button id="next" title="PageDown">next ▶</button>
    <button id="clear" title="Delete">Clear</button>
    <span class="adv">copy from <input id="copyFrom" type="text" size="2" maxlength="2" title="type a character, its pixels are copied here"></span>
  </div>
  <div class="editor">
    <canvas id="grid"></canvas>
    <div class="legend">
      <div><i style="background:var(--baseline)"></i>baseline</div>
      <div><i style="background:var(--cap)"></i>cap height <span id="capH"></span></div>
      <div><i style="background:var(--xh)"></i>x-height <span id="xH"></span></div>
      <div><i style="background:var(--advance)"></i>advance (next glyph starts here)</div>
      <div><i style="background:var(--overhang)"></i>overhang: allowed, but rarely wanted</div>
      <br>
      <div><kbd>LMB</kbd> draw · <kbd>RMB</kbd> erase · drag paints</div>
      <div><kbd>Ctrl</kbd>+<kbd>←↑↓→</kbd> shift glyph</div>
      <div><kbd>[</kbd> <kbd>]</kbd> advance · <kbd>Del</kbd> clear</div>
      <div><kbd>PgUp</kbd> <kbd>PgDn</kbd> prev / next glyph</div>
      <div><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>S</kbd> save</div>
    </div>
  </div>
</main>

<footer>
  <input id="sampleText" type="text" value="Чуєш їх, доцю, га? Кумедна ж ти! The quick brown fox 0123456789">
  <canvas id="sample"></canvas>
</footer>

<script>
(() => {
  const CELL = 36;
  const $ = (id) => document.getElementById(id);
  let font = null;          // from /api/font
  let order = [];           // codepoints in sidebar order
  let current = null;       // codepoint being edited
  const dirty = new Set();  // codepoints changed since last save
  const undoStack = {};     // cp -> [{advance, pixels}]
  let items = {};           // cp -> sidebar element

  const key = (x, y) => `${x},${y}`;
  const glyph = (cp) => font.glyphs[String(cp)] || (font.glyphs[String(cp)] = { advance: 4, pixels: [], name: `U+${cp.toString(16).toUpperCase().padStart(4, "0")}` });
  const pixelSet = (g) => new Set(g.pixels.map(([x, y]) => key(x, y)));
  const isSpace = (cp) => /\s/.test(String.fromCodePoint(cp));
  const label = (cp) => { const ch = String.fromCodePoint(cp); return isSpace(cp) ? "␣" : ch; };

  // ---------------------------------------------------------------- loading
  async function load() {
    font = await (await fetch("/api/font")).json();
    order = font.charset.slice();
    for (const k of Object.keys(font.glyphs)) { const cp = Number(k); if (!order.includes(cp)) order.push(cp); }
    $("capH").textContent = font.guides.cap_height ?? "";
    $("xH").textContent = font.guides.x_height ?? "";
    buildList();
    select(order.find((cp) => glyph(cp).pixels.length === 0 && !isSpace(cp)) ?? order[0]);
    setStatus();
  }

  function groupOf(cp) {
    if (cp < 0x80) return "Basic Latin";
    if (cp >= 0x400 && cp < 0x500) return "Cyrillic";
    return "Typography";
  }

  function buildList() {
    const list = $("list");
    list.innerHTML = "";
    items = {};
    let lastGroup = null, grid = null;
    for (const cp of order) {
      const g = groupOf(cp);
      if (g !== lastGroup) {
        const h = document.createElement("div"); h.className = "group"; h.textContent = g; list.appendChild(h);
        grid = document.createElement("div"); grid.className = "list"; list.appendChild(grid);
        lastGroup = g;
      }
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `<canvas width="24" height="24"></canvas><span class="ch"></span>`;
      el.querySelector(".ch").textContent = label(cp);
      el.title = glyph(cp).name;
      el.addEventListener("click", () => select(cp));
      grid.appendChild(el);
      items[cp] = el;
      paintThumb(cp);
    }
  }

  function paintThumb(cp) {
    const el = items[cp]; if (!el) return;
    const g = glyph(cp);
    el.classList.toggle("empty", g.pixels.length === 0 && !isSpace(cp));
    const c = el.querySelector("canvas"), ctx = c.getContext("2d");
    const rows = font.ascent + font.descent, s = Math.floor(24 / Math.max(rows, 8));
    ctx.clearRect(0, 0, 24, 24);
    ctx.fillStyle = "#1a1a1a";
    const ox = Math.max(0, Math.floor((24 - g.advance * s) / 2)), oy = Math.floor((24 - rows * s) / 2);
    for (const [x, y] of g.pixels) ctx.fillRect(ox + x * s, oy + (font.ascent - 1 - y) * s, s, s);
  }

  // ---------------------------------------------------------------- selection
  function select(cp) {
    if (current !== null && items[current]) items[current].classList.remove("sel");
    current = cp;
    const el = items[cp];
    if (el) { el.classList.add("sel"); el.scrollIntoView({ block: "nearest" }); }
    const g = glyph(cp);
    $("title").textContent = label(cp);
    $("name").textContent = `U+${cp.toString(16).toUpperCase().padStart(4, "0")} ${g.name}`;
    $("advance").textContent = g.advance;
    drawGrid();
    drawSample();
  }

  // ---------------------------------------------------------------- grid
  function gridCols() {
    const g = glyph(current);
    const maxX = g.pixels.reduce((m, [x]) => Math.max(m, x + 1), 0);
    return Math.max(g.advance + 2, maxX + 1, 8);
  }

  function drawGrid() {
    const c = $("grid"), ctx = c.getContext("2d");
    const g = glyph(current), on = pixelSet(g);
    const cols = gridCols(), rows = font.ascent + font.descent;
    c.width = cols * CELL + 1; c.height = rows * CELL + 1;
    for (let r = 0; r < rows; r++) {
      const y = font.ascent - 1 - r;
      for (let col = 0; col < cols; col++) {
        ctx.fillStyle = on.has(key(col, y)) ? cssVar("--cell-on") : (col >= g.advance ? cssVar("--overhang") : cssVar("--cell-off"));
        ctx.fillRect(col * CELL + 1, r * CELL + 1, CELL - 1, CELL - 1);
      }
    }
    ctx.strokeStyle = cssVar("--grid"); ctx.lineWidth = 1;
    for (let col = 0; col <= cols; col++) line(ctx, col * CELL + .5, 0, col * CELL + .5, rows * CELL);
    for (let r = 0; r <= rows; r++) line(ctx, 0, r * CELL + .5, cols * CELL, r * CELL + .5);
    // guides: a horizontal guide at height h sits on the top edge of row y = h-1
    const yEdge = (h) => (font.ascent - h) * CELL + .5;
    ctx.lineWidth = 3;
    if (font.guides.x_height) { ctx.strokeStyle = cssVar("--xh"); line(ctx, 0, yEdge(font.guides.x_height), cols * CELL, yEdge(font.guides.x_height)); }
    if (font.guides.cap_height) { ctx.strokeStyle = cssVar("--cap"); line(ctx, 0, yEdge(font.guides.cap_height), cols * CELL, yEdge(font.guides.cap_height)); }
    ctx.strokeStyle = cssVar("--baseline"); line(ctx, 0, yEdge(0), cols * CELL, yEdge(0));
    ctx.strokeStyle = cssVar("--advance"); line(ctx, g.advance * CELL + .5, 0, g.advance * CELL + .5, rows * CELL);
    // row numbers
    ctx.fillStyle = "#999"; ctx.font = "10px system-ui";
    for (let r = 0; r < rows; r++) ctx.fillText(String(font.ascent - 1 - r), 3, r * CELL + 12);
  }

  function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function cellAt(ev) {
    const r = $("grid").getBoundingClientRect();
    const col = Math.floor((ev.clientX - r.left) / CELL), row = Math.floor((ev.clientY - r.top) / CELL);
    if (col < 0 || row < 0 || col >= gridCols() || row >= font.ascent + font.descent) return null;
    return [col, font.ascent - 1 - row];
  }

  let painting = null; // true = draw, false = erase
  $("grid").addEventListener("pointerdown", (ev) => {
    const cell = cellAt(ev); if (!cell) return;
    ev.preventDefault();
    $("grid").setPointerCapture(ev.pointerId);
    pushUndo();
    const on = pixelSet(glyph(current));
    painting = ev.button === 2 ? false : !on.has(key(...cell));
    setPixel(cell, painting);
  });
  $("grid").addEventListener("pointermove", (ev) => {
    if (painting === null) return;
    const cell = cellAt(ev); if (cell) setPixel(cell, painting);
  });
  const stop = () => { painting = null; };
  $("grid").addEventListener("pointerup", stop);
  $("grid").addEventListener("pointercancel", stop);
  $("grid").addEventListener("contextmenu", (ev) => ev.preventDefault());

  function setPixel([x, y], value) {
    const g = glyph(current), on = pixelSet(g);
    const k = key(x, y);
    if (on.has(k) === value) return;
    if (value) g.pixels.push([x, y]); else g.pixels = g.pixels.filter(([px, py]) => key(px, py) !== k);
    changed();
  }

  function changed() {
    dirty.add(current);
    paintThumb(current);
    drawGrid();
    drawSample();
    setStatus();
  }

  // ---------------------------------------------------------------- edits
  function pushUndo() {
    const g = glyph(current);
    (undoStack[current] ||= []).push({ advance: g.advance, pixels: g.pixels.map((p) => p.slice()) });
    if (undoStack[current].length > 100) undoStack[current].shift();
  }
  function undo() {
    const st = undoStack[current]; if (!st || !st.length) return;
    const prev = st.pop();
    const g = glyph(current); g.advance = prev.advance; g.pixels = prev.pixels;
    $("advance").textContent = g.advance;
    changed();
  }
  function setAdvance(d) {
    const g = glyph(current); if (g.advance + d < 1) return;
    pushUndo(); g.advance += d; $("advance").textContent = g.advance; changed();
  }
  function shift(dx, dy) {
    const g = glyph(current);
    pushUndo(); g.pixels = g.pixels.map(([x, y]) => [x + dx, y + dy]); changed();
  }
  function clearGlyph() { pushUndo(); glyph(current).pixels = []; changed(); }
  function copyFrom(ch) {
    const cp = ch.codePointAt(0); const src = font.glyphs[String(cp)];
    if (!src || cp === current) return;
    pushUndo();
    const g = glyph(current); g.pixels = src.pixels.map((p) => p.slice()); g.advance = src.advance;
    $("advance").textContent = g.advance; changed();
  }
  function step(d) {
    const i = order.indexOf(current);
    select(order[(i + d + order.length) % order.length]);
  }

  // ---------------------------------------------------------------- save
  async function save() {
    if (!dirty.size) return;
    const glyphs = {};
    for (const cp of dirty) glyphs[cp] = { advance: glyph(cp).advance, pixels: glyph(cp).pixels };
    $("save").disabled = true;
    try {
      const res = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ glyphs }) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || res.statusText);
      dirty.clear();
      setStatus(`saved · ${out.drawn}/${out.required} drawn`);
    } catch (e) {
      setStatus(`save failed: ${e.message}`);
    } finally { $("save").disabled = false; }
  }

  function setStatus(text) {
    const s = $("status");
    if (text) { s.textContent = text; s.className = ""; return; }
    const drawn = order.filter((cp) => glyph(cp).pixels.length || isSpace(cp)).length;
    s.textContent = dirty.size ? `${dirty.size} unsaved glyph(s) · ${drawn}/${order.length} drawn` : `${font.source} · ${drawn}/${order.length} drawn`;
    s.className = dirty.size ? "dirty" : "";
  }
  window.addEventListener("beforeunload", (ev) => { if (dirty.size) { ev.preventDefault(); ev.returnValue = ""; } });

  // ---------------------------------------------------------------- sample strip
  function drawSample() {
    const S = 3, text = $("sampleText").value;
    const c = $("sample"), ctx = c.getContext("2d");
    const rows = font.ascent + font.descent;
    const widths = [...text].map((ch) => { const g = font.glyphs[String(ch.codePointAt(0))]; return g ? g.advance : 5; });
    c.width = Math.max(1, widths.reduce((a, b) => a + b, 0) + 2) * S; c.height = (rows + 2) * S;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    let x = 1;
    [...text].forEach((ch, i) => {
      const cp = ch.codePointAt(0), g = font.glyphs[String(cp)];
      if (cp === current) { ctx.fillStyle = cssVar("--sel"); ctx.fillRect(x * S, 0, widths[i] * S, c.height); }
      ctx.fillStyle = "#1a1a1a";
      if (g) for (const [px, py] of g.pixels) ctx.fillRect((x + px) * S, (1 + font.ascent - 1 - py) * S, S, S);
      else { ctx.strokeStyle = "#c33"; ctx.strokeRect(x * S + .5, S + .5, 4 * S, font.ascent * S); }
      x += widths[i];
    });
  }
  $("sampleText").addEventListener("input", drawSample);

  // ---------------------------------------------------------------- wiring
  $("save").addEventListener("click", save);
  $("undo").addEventListener("click", undo);
  $("advMinus").addEventListener("click", () => setAdvance(-1));
  $("advPlus").addEventListener("click", () => setAdvance(1));
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("clear").addEventListener("click", clearGlyph);
  $("copyFrom").addEventListener("input", (ev) => { if (ev.target.value) { copyFrom(ev.target.value); ev.target.value = ""; } });
  $("search").addEventListener("input", (ev) => {
    const v = ev.target.value; if (!v) return;
    const cp = v.codePointAt(0); if (font.glyphs[String(cp)]) select(cp);
    ev.target.value = "";
  });

  document.addEventListener("keydown", (ev) => {
    const typing = ev.target.tagName === "INPUT";
    if (ev.ctrlKey && ev.key.toLowerCase() === "s") { ev.preventDefault(); save(); return; }
    if (ev.ctrlKey && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); return; }
    if (typing) return;
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
    if (ev.ctrlKey && arrows[ev.key]) { ev.preventDefault(); shift(...arrows[ev.key]); return; }
    if (ev.key === "[") setAdvance(-1);
    else if (ev.key === "]") setAdvance(1);
    else if (ev.key === "Delete") clearGlyph();
    else if (ev.key === "PageUp") { ev.preventDefault(); step(-1); }
    else if (ev.key === "PageDown") { ev.preventDefault(); step(1); }
  });

  load().catch((e) => setStatus(`failed to load: ${e.message}`));
})();
</script>
</body>
</html>
